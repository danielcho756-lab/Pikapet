<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><title>PikaPet iPad Complete</title>
<style>
:root{--bg:#eef2ff;--card:#fff;--ink:#182033;--muted:#68738a;--line:#dfe4ef;--accent:#5865f2;--good:#25a56a;--warn:#ef9b32;--bad:#e05252}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{border:0;cursor:pointer}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-columns:240px 1fr}.side{background:#11182b;color:#eef3ff;padding:18px 12px;overflow:auto}.brand{font-size:21px;font-weight:900;padding:6px 10px 18px}.brand small{display:block;font-size:11px;opacity:.55;margin-top:3px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd3e7;text-align:left;padding:11px 12px;border-radius:11px;font-weight:700}.nav button.active,.nav button:hover{background:#273251;color:white}.main{min-width:0;display:flex;flex-direction:column}.top{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0}.wallet{font-size:13px;font-weight:800}.content{padding:16px;overflow:auto;min-height:0}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 25px rgba(35,49,80,.05)}.hero{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1fr);gap:15px}.stage{height:440px;border-radius:22px;background:radial-gradient(circle at 50% 30%,#fff,#dfe7ff);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.pet{width:75%;height:75%;background-repeat:no-repeat;background-position:center;background-size:contain;image-rendering:auto;filter:drop-shadow(0 20px 15px rgba(30,40,70,.18));animation:bob 2.3s ease-in-out infinite}.pet.sleep{animation:none;transform:scale(.92)}@keyframes bob{50%{transform:translateY(-7px)}}.tag{position:absolute;top:14px;left:14px;background:#fff;padding:7px 10px;border-radius:14px;font-weight:800;box-shadow:0 4px 15px #0001}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#f5f7fb;padding:10px;border-radius:13px}.stat b{display:block;font-size:11px;color:var(--muted)}.bar{height:7px;background:#dfe4ef;border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--accent);width:50%}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.btn{padding:11px 8px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}.btn.alt{background:#e9edf6;color:var(--ink)}.btn.good{background:var(--good)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}h2{margin:0 0 12px;font-size:20px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:white;outline:none}.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:12px}.dex{padding:10px;border:1px solid var(--line);border-radius:14px;background:white;cursor:pointer}.dex:hover{border-color:var(--accent)}.dex .no{font-size:10px;color:var(--muted)}.dex .name{font-weight:800;margin-top:3px}.spriteThumb{height:105px;background-position:center;background-repeat:no-repeat;background-size:contain}.log{height:180px;background:#101728;color:#dfe7ff;border-radius:14px;padding:11px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}.battle{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fighter{min-height:270px;background:linear-gradient(160deg,#fff,#edf1ff);border-radius:18px;padding:14px;position:relative}.fighter .mini{height:180px;background:center/contain no-repeat}.hp{height:10px;background:#dfe4ef;border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;background:var(--good);width:100%}.modal{position:fixed;inset:0;background:#0b102466;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{max-width:720px;width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.close{float:right;border-radius:10px;padding:7px 10px;background:#edf0f6}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#121a2d;color:#fff;padding:10px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.hero,.battle{grid-template-columns:1fr}.stage{height:45vh}.content{padding:11px}.grid{grid-template-columns:1fr 1fr}.top{padding-left:12px;padding-right:12px}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PikaPet">
</head><body><div class="app"><aside class="side"><div class="brand">🐾 PikaPet<small>iPad Complete Port</small></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><h1 id="title">홈</h1><div class="wallet">🪙 <span id="coins">0</span>　💎 <span id="gems">0</span></div></header><div class="content" id="content"></div></main></div><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">닫기</button><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const NAV=[['home','🏠','홈'],['pet','🐾','펫'],['dex','📖','도감'],['battle','⚔️','배틀'],['gym','🏅','체육관'],['gacha','🎰','가챠'],['mine','⛏️','광산'],['omok','🎮','오목'],['quiz','❓','퀴즈'],['shop','🛒','상점'],['rocket','🚀','로켓단'],['party','👥','파티'],['titles','🏆','칭호'],['settings','⚙️','설정']];
let data=[], gyms=null, sprites=[], S=JSON.parse(localStorage.getItem('pikapet-complete')||'null')||{coins:1500,gems:20,food:20,level:12,xp:55,hunger:78,happy:82,affection:61,selected:'luxio',owned:['luxio'],party:['luxio'],badges:[],titles:['초보 트레이너'],title:'초보 트레이너',discovered:[],inventory:{potion:3,stone:1,ticket:2},mine:0,streak:0,quiz:0};
const el=id=>document.getElementById(id);function save(){localStorage.setItem('pikapet-complete',JSON.stringify(S));sync()}function sync(){el('coins').textContent=S.coins;el('gems').textContent=S.gems}function toast(t){let x=el('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function sprite(name,anim='Idle'){return `assets/sprites/${name}/${anim}-Anim.png`}
function setNav(active){el('nav').innerHTML=NAV.map(n=>`<button class="${active===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}
function go(page){setNav(page);el('title').textContent=NAV.find(n=>n[0]===page)[2];let c=el('content');c.innerHTML=pages[page]();if(handlers[page])handlers[page]();sync()}
function petData(){return data.find(x=>x.en===S.selected)||data.find(x=>x.en==='luxio')||data[0]}
function action(a){let p=petData();if(a==='eat'){S.hunger=Math.min(100,S.hunger+20);S.food=Math.max(0,S.food-1)}if(a==='play'){S.happy=Math.min(100,S.happy+16);S.affection=Math.min(100,S.affection+4)}if(a==='walk'){S.happy=Math.min(100,S.happy+9);S.hunger=Math.max(0,S.hunger-5);S.affection=Math.min(100,S.affection+3)}if(a==='sleep'){S.hunger=Math.max(0,S.hunger-2)}if(a==='pet'){S.affection=Math.min(100,S.affection+3);S.happy=Math.min(100,S.happy+2)}save();go('pet');toast('상태가 저장되었습니다')}
function choose(name){if(!S.owned.includes(name)){toast('먼저 획득해야 합니다');return}S.selected=name;save();go('pet')}
const pages={
home:()=>`<div class="hero"><div class="stage"><div class="tag">${petData().kr||petData().en} · Lv.${S.level}</div><div class="pet" style="background-image:url('${sprite(S.selected)}')"></div></div><div class="card"><h2>PikaPet</h2><p class="muted">원본 V4 리소스를 기반으로 iPad 터치 환경에 맞게 재구성했습니다.</p><div class="stats"><div class="stat"><b>배고픔</b><div class="bar"><div class="fill" style="width:${S.hunger}%"></div></div></div><div class="stat"><b>행복도</b><div class="bar"><div class="fill" style="width:${S.happy}%"></div></div></div><div class="stat"><b>친밀도</b><div class="bar"><div class="fill" style="width:${S.affection}%"></div></div></div><div class="stat"><b>경험치</b><div class="bar"><div class="fill" style="width:${S.xp}%"></div></div></div></div><div class="actions"><button class="btn" onclick="action('eat')">🍎 먹이</button><button class="btn" onclick="action('play')">🎾 놀기</button><button class="btn alt" onclick="action('walk')">🚶 산책</button><button class="btn alt" onclick="action('sleep')">💤 잠자기</button><button class="btn good" onclick="action('pet')">❤️ 쓰다듬기</button><button class="btn warn" onclick="go('battle')">⚔️ 배틀</button></div><hr><p class="muted">도감 ${S.discovered.length}/636 · 보유 펫 ${S.owned.length} · 뱃지 ${S.badges.length}/8</p></div></div>`,
pet:()=>`<h2>🐾 펫 관리</h2><div class="grid"><div class="card"><div class="stage" style="height:350px"><div class="pet" style="background-image:url('${sprite(S.selected)}')"></div></div><h3>${petData().kr} (${petData().en})</h3><p class="muted">${petData().desc||'나만의 파트너 포켓몬입니다.'}</p></div><div class="card"><h3>행동</h3><div class="actions"><button class="btn" onclick="action('eat')">🍎 먹이</button><button class="btn" onclick="action('play')">🎾 놀기</button><button class="btn" onclick="action('walk')">🚶 산책</button><button class="btn" onclick="action('sleep')">💤 잠자기</button><button class="btn good" onclick="action('pet')">❤️ 쓰다듬기</button></div><h3 style="margin-top:20px">보유 펫</h3><div class="list">${S.owned.map(n=>{let p=data.find(x=>x.en===n);return `<div class="item"><span>${p?.kr||n}</span><button class="btn alt" onclick="choose('${n}')">선택</button></div>`}).join('')}</div></div></div>`,
dex:()=>`<h2>📖 전국/확장 도감</h2><input class="search" id="dexSearch" placeholder="포켓몬 이름 검색 (한글/영문/번호)"><div class="dexgrid" id="dexGrid"></div>`,
battle:()=>`<h2>⚔️ 배틀</h2><div class="battle"><div class="fighter"><b>${petData().kr} · Lv.${S.level}</b><div class="mini" style="background-image:url('${sprite(S.selected)}')"></div><div class="hp"><i id="myhp"></i></div></div><div class="fighter"><b id="enemyName">야생 포켓몬</b><div class="mini" id="enemySprite"></div><div class="hp"><i id="enemyhp"></i></div></div></div><div class="card" style="margin-top:12px"><div class="actions"><button class="btn" onclick="attack()">⚡ 공격</button><button class="btn warn" onclick="skill()">✨ 필살기</button><button class="btn alt" onclick="healBattle()">🧪 회복</button><button class="btn bad" onclick="flee()">🏃 도망</button></div><div class="log" id="battleLog">전투를 시작합니다.</div></div>`,
gym:()=>`<h2>🏅 신오 체육관</h2><div class="grid">${(gyms?.gyms||[]).map(g=>`<div class="card"><h3>${g.order}. ${g.leader_kr} <span class="muted">${g.city_kr}</span></h3><p>타입: ${g.type} · ${g.badge_kr}</p><p class="muted">${g.team.map(t=>t.species_en+' Lv.'+t.level).join(', ')}</p><button class="btn" onclick="gymBattle(${g.order})">도전</button></div>`).join('')}</div>`,
gacha:()=>`<h2>🎰 코인 가챠</h2><div class="card"><p>코인 300개로 무작위 펫을 획득합니다. 전설/희귀 펫의 등장 확률은 낮습니다.</p><button class="btn" onclick="gacha()">🎰 300 코인 돌리기</button><div id="gachaResult" style="margin-top:12px"></div></div>`,
mine:()=>`<h2>⛏️ 광산</h2><div class="card"><p>광산을 탐험해 코인, 보석, 진화 재료를 얻습니다.</p><button class="btn" onclick="mine()">⛏️ 채굴하기</button><div id="mineResult" style="margin-top:12px"></div></div>`,
omok:()=>`<h2>🎮 오목</h2><div class="card"><p class="muted">터치로 돌을 놓고 간단한 5목 AI와 대전합니다.</p><div id="board" style="display:grid;grid-template-columns:repeat(11,1fr);max-width:550px;aspect-ratio:1;margin:auto;background:#d5ad6d;border:8px solid #9b7438"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="resetOmok()">새 게임</button></div></div>`,
quiz:()=>`<h2>❓ 포켓몬 퀴즈</h2><div class="card"><div id="quizArea"></div></div>`,
shop:()=>`<h2>🛒 상점</h2><div class="grid"><div class="card"><h3>포션</h3><p>전투 HP를 회복합니다.</p><button class="btn" onclick="buy('potion',100)">100 코인</button></div><div class="card"><h3>진화의 돌</h3><p>진화 가능한 펫의 성장에 사용합니다.</p><button class="btn" onclick="buy('stone',600)">600 코인</button></div><div class="card"><h3>가챠 티켓</h3><p>무료 가챠 티켓.</p><button class="btn" onclick="buy('ticket',900)">900 코인</button></div></div>`,
rocket:()=>`<h2>🚀 로켓단 이벤트</h2><div class="card"><h3>로켓단 습격</h3><p>제한 시간 이벤트를 모사한 싱글 전투입니다. 승리하면 보상을 얻습니다.</p><button class="btn bad" onclick="rocketBattle()">🚀 출동</button><div id="rocketResult" style="margin-top:12px"></div></div>`,
party:()=>`<h2>👥 파티</h2><div class="grid">${S.party.map((n,i)=>{let p=data.find(x=>x.en===n);return `<div class="card"><h3>${i+1}. ${p?.kr||n}</h3><div class="spriteThumb" style="background-image:url('${sprite(n)}')"></div><p>Lv.${S.level}</p></div>`}).join('')}</div><div class="card" style="margin-top:12px"><button class="btn" onclick="addRandomParty()">➕ 랜덤 펫 추가</button></div>`,
titles:()=>`<h2>🏆 칭호</h2><div class="list">${S.titles.map(t=>`<div class="item"><b>${t}</b><button class="btn alt" onclick="S.title='${t}';save();toast('칭호 변경')">장착</button></div>`).join('')}</div>`,
settings:()=>`<h2>⚙️ 설정 / 저장</h2><div class="grid"><div class="card"><h3>현재 저장</h3><p>브라우저 로컬 저장소에 자동 저장됩니다.</p><button class="btn" onclick="save();toast('저장 완료')">💾 지금 저장</button></div><div class="card"><h3>초기화</h3><p>모든 진행 상황을 삭제합니다.</p><button class="btn bad" onclick="resetAll()">🗑️ 데이터 초기화</button></div><div class="card"><h3>iPad 설치</h3><p>Safari에서 공유 → 홈 화면에 추가를 사용하면 앱처럼 실행할 수 있습니다.</p></div></div>`};
const handlers={dex:()=>{renderDex(data);el('dexSearch').oninput=e=>renderDex(data.filter(p=>(p.kr+p.en+p.dex).toString().toLowerCase().includes(e.target.value.toLowerCase())) )},battle:startBattle,omok:initOmok,quiz:initQuiz};
function renderDex(arr){el('dexGrid').innerHTML=arr.slice(0,636).map(p=>`<div class="dex" onclick="dexDetail(${p.dex})"><div class="no">#${String(p.dex).padStart(3,'0')}</div><div class="spriteThumb" style="background-image:url('${sprite(p.en)}')"></div><div class="name">${p.kr}</div><div class="muted">${p.en}</div></div>`).join('')}
function dexDetail(id){let p=data.find(x=>x.dex===id);if(!p)return;el('modalBody').innerHTML=`<h2>#${p.dex} ${p.kr}</h2><div class="spriteThumb" style="height:220px;background-image:url('${sprite(p.en)}')"></div><p>${p.desc||''}</p><p>타입: ${p.types.join(' / ')} · HP ${p.hp} · ATK ${p.atk} · DEF ${p.def||'-'} · SPD ${p.spd||'-'}</p><p>필살기: ${p.ultimate||'-'}</p>`;el('modal').classList.add('show')}
function closeModal(){el('modal').classList.remove('show')}
let enemy=null,enemyHp=100,myHp=100;function startBattle(){enemy=data[Math.floor(Math.random()*data.length)];enemyHp=100;myHp=100;el('enemyName').textContent=`${enemy.kr} · Lv.${Math.max(1,S.level+Math.floor(Math.random()*5-2))}`;el('enemySprite').style.backgroundImage=`url('${sprite(enemy.en)}')`;paintBattle();}
function paintBattle(){el('myhp').style.width=myHp+'%';el('enemyhp').style.width=enemyHp+'%'}function blog(t){let x=el('battleLog');x.textContent+='\n'+t;x.scrollTop=x.scrollHeight}function attack(){let d=12+Math.floor(Math.random()*18);enemyHp=Math.max(0,enemyHp-d);blog(`공격! ${d} 피해`);enemyTurn();}function skill(){let d=25+Math.floor(Math.random()*30);enemyHp=Math.max(0,enemyHp-d);blog(`필살기! ${d} 피해`);enemyTurn()}function healBattle(){if(S.inventory.potion>0){S.inventory.potion--;myHp=Math.min(100,myHp+35);blog('포션으로 회복했습니다.');paintBattle()}else toast('포션이 없습니다')}function enemyTurn(){if(enemyHp<=0){winBattle();return}let d=7+Math.floor(Math.random()*15);myHp=Math.max(0,myHp-d);blog(`${enemy.kr}의 반격! ${d} 피해`);paintBattle();if(myHp<=0)blog('패배했습니다.')}function winBattle(){S.coins+=100;S.xp+=20;if(S.xp>=100){S.level++;S.xp-=100;toast('레벨 업!')}if(!S.discovered.includes(enemy.dex))S.discovered.push(enemy.dex);save();blog(`승리! ${enemy.kr}을 도감에 기록했습니다.`);paintBattle()}function flee(){go('home');toast('전투에서 이탈했습니다')} 
function gymBattle(i){let g=gyms.gyms.find(x=>x.order===i);let win=Math.random()>.25;if(win){if(!S.badges.includes(i)){S.badges.push(i);S.coins+=300}toast(`${g.badge_kr} 획득!`)}else toast('체육관에 패배했습니다.');save()}
function gacha(){if(S.coins<300){toast('코인이 부족합니다');return}S.coins-=300;let p=data[Math.floor(Math.random()*data.length)];if(!S.owned.includes(p.en))S.owned.push(p.en);S.discovered.push(p.dex);save();el('gachaResult').innerHTML=`<div class="card"><b>🎉 ${p.kr} 획득!</b><div class="spriteThumb" style="background-image:url('${sprite(p.en)}')"></div></div>`}
function mine(){let c=50+Math.floor(Math.random()*251);let g=Math.random()<.2?1:0;S.coins+=c;S.gems+=g;S.mine++;save();el('mineResult').textContent=`⛏️ 코인 ${c}개${g?' · 💎 보석 1개':''} 획득!`}
function buy(k,c){if(S.coins<c){toast('코인이 부족합니다');return}S.coins-=c;S.inventory[k]=(S.inventory[k]||0)+1;save();toast('구매 완료')}
function rocketBattle(){let win=Math.random()>.3;if(win){S.coins+=500;S.gems+=2;save();el('rocketResult').textContent='🚀 승리! 코인 500 + 보석 2 획득'}else el('rocketResult').textContent='💥 로켓단에게 패배했습니다.'}
function addRandomParty(){let p=data[Math.floor(Math.random()*data.length)];if(!S.party.includes(p.en))S.party.push(p.en);if(!S.owned.includes(p.en))S.owned.push(p.en);save();go('party')}
let q=null;function initQuiz(){newQuiz()}function newQuiz(){q=data[Math.floor(Math.random()*data.length)];let opts=[q,...Array.from({length:3},()=>data[Math.floor(Math.random()*data.length)])].sort(()=>Math.random()-.5);el('quizArea').innerHTML=`<h3>이 포켓몬의 이름은?</h3><div class="spriteThumb" style="height:240px;background-image:url('${sprite(q.en)}')"></div><div class="grid">${opts.map(x=>`<button class="btn alt" onclick="answerQuiz('${x.en}')">${x.kr}</button>`).join('')}</div>`}function answerQuiz(n){if(n===q.en){S.coins+=100;S.quiz++;toast('정답! +100 코인')}else toast('오답!');save();newQuiz()}
let omok=[];function initOmok(){resetOmok()}function resetOmok(){omok=Array(121).fill(0);drawBoard()}function drawBoard(){let b=el('board');if(!b)return;b.innerHTML=omok.map((v,i)=>`<button onclick="placeStone(${i})" style="background:#d5ad6d;border:1px solid #9b7438;position:relative">${v===1?'●':v===2?'○':''}</button>`).join('')}function placeStone(i){if(omok[i])return;omok[i]=1;drawBoard();let open=omok.map((v,j)=>v?null:j).filter(x=>x!==null);if(open.length){let r=open[Math.floor(Math.random()*open.length)];omok[r]=2;drawBoard()}}
function resetAll(){if(confirm('정말 초기화할까요?')){localStorage.removeItem('pikapet-complete');location.reload()}}
Promise.all([fetch('assets/pokedex_data_v2.json').then(r=>r.json()),fetch('assets/gen4_gyms.json').then(r=>r.json()),fetch('assets/sprite_manifest.json').then(r=>r.json())]).then(([d,g,s])=>{data=d;gyms=g;sprites=s;if(!S.discovered.length)S.discovered=[data.find(x=>x.en==='luxio')?.dex||404];go('home')});
setInterval(()=>{S.hunger=Math.max(0,S.hunger-.15);S.happy=Math.max(0,S.happy-.08);save()},30000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
